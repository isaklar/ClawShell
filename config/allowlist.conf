# Static, always-on egress allowlist for quota-guard. One host[:port] or
# "*.suffix" wildcard per line. Host-specific/optional entries (e.g. Home
# Assistant) go in allowlist.d/ instead — see docs/networking.md.
#
# GitHub — repository + API operations
github.com:443
api.github.com:443
codeload.github.com:443
*.githubusercontent.com:443

# Model provider — the DEFAULT is MODEL_PROVIDER=local-gpu, which runs
# inference ENTIRELY on the on-box GPU (the local-llm service on the internal
# clawshell-inference network). In that mode NO external model-provider host is
# needed or allowed here — engagement data never leaves the box. Leave every
# line below commented for local-gpu.
#
# Only if you switch MODEL_PROVIDER to a hosted provider, uncomment exactly the
# host matching your choice in .env (see docs/credentials.md). Do not enable
# more than one provider's inference host "just in case".
#
# MODEL_PROVIDER=github-copilot (uses an existing Copilot subscription — no
# separate API key). github.com/api.github.com above already cover
# device-login/auth; this is the actual inference host:
# *.githubcopilot.com:443
#
# MODEL_PROVIDER=anthropic (separate Anthropic API key):
# api.anthropic.com:443
#
# MODEL_PROVIDER=openai (separate OpenAI API key):
# api.openai.com:443

# Web search (DuckDuckGo) — key-free provider used ONLY by the main
# (researcher/architect) and recon agents' web_search tool (see
# agents.entries.main/recon in config/openclaw.json5.example).
# exploit/reporter have zero web-tool access regardless (group:web denied).
# This is the ONLY general-internet host this box can ever reach — every
# other entry above is scoped to GitHub or your chosen model provider.
html.duckduckgo.com:443
duckduckgo.com:443

# One-time only: fetching the @openclaw/duckduckgo-plugin package itself.
# Needed the first time scripts/setup-team.sh installs it; safe to comment
# out again afterwards (re-enable temporarily if you ever reinstall/upgrade
# the plugin). Not needed at all if you skip web search entirely.
registry.npmjs.org:443

# ---------------------------------------------------------------------------
# ANY_HTTPS — deliberate, loud opt-out of deny-by-default. Read before enabling.
# ---------------------------------------------------------------------------
# Allows the Gateway container to reach ANY host on port 443 (HTTPS only,
# never plain HTTP or other ports). This exists for exactly one reason: the
# `main` (architect) agent's web_fetch tool needs to read the full content of
# whatever URL it found via web_search, not just a search snippet — and
# web_fetch always runs directly from this container, so it can't be routed
# through one fixed proxy/API host the way web_search (DuckDuckGo) is.
#
# What this does NOT open:
#   - Shell/exec for any agent — every session's exec still runs inside its
#     own per-task sandbox container on the `clawshell-sandbox` Docker network,
#     which is `internal: true` and has NO route out at all, regardless of
#     this entry.
#   - web_fetch for recon/exploit/reporter — the TOOL itself is denied
#     for them in config/openclaw.json5.example (agents.entries.*.tools),
#     independent of what the network layer allows. A network opening with
#     no tool access granted is inert.
#   - Your LAN — quota-guard resolves every hostname and rejects private/
#     loopback/link-local destination IPs regardless of ANY_HTTPS (SSRF
#     protection, see docs/networking.md). It cannot be used to reach your
#     router, NAS, or other LAN hosts.
#
# What it DOES open: any public HTTPS endpoint is now reachable from the
# Gateway container's own process (not per-agent — quota-guard has no way to
# attribute a given proxied request to one specific agent). The only thing
# keeping this scoped to "main reads docs it found via search" is that
# main is the only agent whose tools config includes web_fetch. If you ever
# grant web_fetch to another agent, it gets the exact same reach.
#
# Disabled by default so the platform stays strict deny-by-default: no
# arbitrary-HTTPS egress out of the box. To grant main's web_fetch tool
# access to arbitrary advisory/vendor pages, uncomment this line AND remove
# "web_fetch" from agents.entries.main.tools.deny in
# config/openclaw.json5.example. Both changes are required: the line alone is
# inert without the tool, and the tool alone is inert without the line.
# ANY_HTTPS
