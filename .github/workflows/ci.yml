name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # mitmproxy and mcp are stubbed by tests/unit/_stubs.py, so only httpx
      # (a real import in pentest-tools-mcp/server.py) is required on the runner.
      - name: Install Python test dependencies
        run: python3 -m pip install --upgrade pip httpx

      - name: Run regression suite
        run: bash tests/run-all.sh
