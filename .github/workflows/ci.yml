name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # mitmproxy and mcp are stubbed by tests/unit/_stubs.py, so only httpx
      # (a real import in pentest-tools-mcp/server.py) is required on the runner.
      - name: Install Python test dependencies
        run: python3 -m pip install --upgrade pip httpx

      - name: Install maintenance test dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd jq

      - name: Run regression suite
        run: bash tests/run-all.sh

  integration:
    name: docker-integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run real Docker boundary and recovery tests
        run: bash tests/run-integration.sh --artifacts "$RUNNER_TEMP/clawshell-integration-artifacts"

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-integration-diagnostics
          path: ${{ runner.temp }}/clawshell-integration-artifacts
          if-no-files-found: warn
          retention-days: 7
