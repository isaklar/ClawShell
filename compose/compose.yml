# ClawShell Docker Compose stack.
#
# Network topology (see docs/networking.md for the full diagram):
#   clawshell-control   : bridge, published to LAN_ALLOW_CIDR only -> Control UI/API
#   clawshell-egress    : internal bridge, Gateway <-> quota-guard, NO other route out
#   clawshell-sandbox   : internal bridge, Gateway <-> sandbox-dind, NO internet route
#   clawshell-inference : internal bridge, Gateway <-> local-llm (on-box GPU), NO internet route
#
# Only quota-guard has a route to the real internet (its own default network
# interface). Everything else is boxed in. The local GPU model server
# (local-llm) is on a dedicated internal network reachable only by the
# Gateway and never routed through quota-guard — local inference needs no
# egress at all (see docs/credentials.md, docs/architecture.md §1).

name: clawshell

networks:
  clawshell-control:
    driver: bridge
  clawshell-egress:
    driver: bridge
    internal: true
  clawshell-sandbox:
    driver: bridge
    internal: true
  # Gateway <-> local GPU inference server only. internal: true == no route to
  # the internet or your LAN; model tokens never leave the box.
  clawshell-inference:
    driver: bridge
    internal: true
  # Only quota-guard is attached to this one; it is the single container with
  # a real route to the internet. Nothing else in this compose file joins it.
  clawshell-uplink:
    driver: bridge
  # --- Black-box live-testing lanes (profile: blackbox-live) ----------------
  # These are only used when a black-box live engagement is armed. On a normal
  # white-box / spec-only / local-LLM deployment the profiled services below
  # never start, so these networks carry no traffic.
  #   clawshell-mcp    : Gateway <-> pentest-tools-mcp (internal, no route out).
  #   clawshell-target : pentest-tools-mcp <-> target-gateway (internal). Forces
  #                      every tool request through the scoped target-gateway.
  clawshell-mcp:
    driver: bridge
    internal: true
  clawshell-target:
    driver: bridge
    internal: true
  # The ONLY route from the black-box lane to the internet. Attached solely to
  # target-gateway, which enforces deny-by-default in-scope-only egress on it.
  clawshell-target-uplink:
    driver: bridge

secrets:
  gateway_token:
    file: ../secrets/gateway_token
  model_provider_api_key:
    file: ../secrets/model_provider_api_key
  github_agent_token:
    file: ../secrets/github_agent_token

services:
  quota-guard:
    build: ../quota-guard
    image: clawshell/quota-guard:local
    container_name: clawshell-quota-guard
    restart: unless-stopped
    networks:
      - clawshell-egress
      - clawshell-uplink
    # No `ports:` here. quota-guard reaches the real internet only via
    # clawshell-uplink (a normal, non-internal bridge attached to nothing else in
    # this file); it talks to the Gateway only via clawshell-egress (internal,
    # no route out). This is what makes it the sole egress choke point.
    volumes:
      - ../state/quota-guard:/state
      - ../logs/quota-guard:/logs
      - ../config/allowlist.d:/allowlist.d:ro
      - ../config/allowlist.conf:/config/allowlist.conf:ro
    environment:
      MAX_ITERATIONS_PER_TASK: "${MAX_ITERATIONS_PER_TASK:-50}"
      MAX_AI_REQUESTS_PER_TASK: "${MAX_AI_REQUESTS_PER_TASK:-100}"
      MAX_RETRIES_PER_OPERATION: "${MAX_RETRIES_PER_OPERATION:-3}"
      QUOTA_GUARD_FAILURE_THRESHOLD: "${QUOTA_GUARD_FAILURE_THRESHOLD:-5}"
      QUOTA_GUARD_FAILURE_WINDOW_SECONDS: "${QUOTA_GUARD_FAILURE_WINDOW_SECONDS:-60}"
      QUOTA_GUARD_BACKOFF_BASE_SECONDS: "${QUOTA_GUARD_BACKOFF_BASE_SECONDS:-10}"
      QUOTA_GUARD_BACKOFF_MAX_SECONDS: "${QUOTA_GUARD_BACKOFF_MAX_SECONDS:-3600}"
      # Real enforcement (not just PAT scoping) of which GitHub repos the
      # agent is allowed to clone/fetch/push/PR against, see
      # github/PROVISIONING.md and docs/networking.md. Empty = unenforced.
      GITHUB_ALLOWED_REPOS: "${GITHUB_ALLOWED_REPOS:-}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8088/status',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.9.4}
    container_name: clawshell-openclaw-gateway
    restart: unless-stopped
    depends_on:
      quota-guard:
        condition: service_healthy
      sandbox-dind:
        condition: service_started
    networks:
      - clawshell-control
      - clawshell-egress
      - clawshell-sandbox
      - clawshell-inference
      # Reaches the curated pentest-tools MCP server during a black-box live
      # engagement. Carries no traffic unless the blackbox-live profile is up.
      - clawshell-mcp
    ports:
      # Bound to the LAN CIDR at the firewall layer (see firewall/nftables.conf);
      # Compose publishes on all interfaces, nftables restricts who can reach it.
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    environment:
      HTTP_PROXY: "http://quota-guard:8080"
      HTTPS_PROXY: "http://quota-guard:8080"
      # local-llm is the on-box GPU inference server (see docs/credentials.md).
      # It is listed in NO_PROXY so model calls go straight to it over the
      # internal clawshell-inference network instead of out through
      # quota-guard — local inference needs no egress and no circuit breaker
      # (there is no external spend to protect). sandbox-dind is the nested
      # Docker control plane; localhost covers the Gateway's own services.
      NO_PROXY: "local-llm,local-llm-amd,sandbox-dind,pentest-tools-mcp,localhost,127.0.0.1"
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
      # Model provider key delivered as a file; entrypoint/config maps it to
      # the correct env var for the provider chosen in .env (see
      # config/openclaw.json5.example and docs/credentials.md).
      #
      # Default MODEL_PROVIDER=local-gpu: inference is served by the on-box
      # local-llm service (e.g. an NVIDIA GPU), reachable at LOCAL_LLM_BASE_URL
      # below. No API key, no egress. Switch to github-copilot/anthropic/
      # openai/custom in .env to use a hosted provider instead.
      MODEL_PROVIDER: "${MODEL_PROVIDER:-local-gpu}"
      MODEL_PROVIDER_API_KEY_FILE: /run/secrets/model_provider_api_key
      MODEL_PROVIDER_BASE_URL: "${MODEL_PROVIDER_BASE_URL:-}"
      # Internal address of the on-box GPU model server (OpenAI-compatible).
      # Only meaningful when MODEL_PROVIDER=local-gpu; ignored otherwise.
      LOCAL_LLM_BASE_URL: "${LOCAL_LLM_BASE_URL:-http://local-llm:8000/v1}"
      LOCAL_LLM_MODEL: "${LOCAL_LLM_MODEL:-}"
      GITHUB_AGENT_TOKEN_FILE: /run/secrets/github_agent_token
      GITHUB_ALLOWED_REPOS: "${GITHUB_ALLOWED_REPOS:-}"
      # Commit identity for the agent's own git operations — standard git
      # env vars, honored by any `git commit` run inside the container or
      # its sandbox. Falls back to a generic bot identity if unset. The
      # noreply.github.com address is GitHub's own privacy-preserving
      # convention, not something specific to this repo.
      GIT_AUTHOR_NAME: "${GITHUB_AGENT_USERNAME:-clawshell-bot}"
      GIT_AUTHOR_EMAIL: "${GITHUB_AGENT_USERNAME:-clawshell-bot}@users.noreply.github.com"
      GIT_COMMITTER_NAME: "${GITHUB_AGENT_USERNAME:-clawshell-bot}"
      GIT_COMMITTER_EMAIL: "${GITHUB_AGENT_USERNAME:-clawshell-bot}@users.noreply.github.com"
      OPENCLAW_DOCKER_SOCKET: "tcp://sandbox-dind:2375"
      DOCKER_HOST: "tcp://sandbox-dind:2375"
    secrets:
      - gateway_token
      - model_provider_api_key
      - github_agent_token
    volumes:
      - ../state/openclaw:/home/node/.openclaw
      - ../workspaces:/home/node/workspace
      # Engagement inputs are mounted READ-ONLY: the agents may analyze the
      # target code and spec but can never modify them. The only writable
      # output is the report under /home/node/workspace/reports/ (see
      # docs/pentest-team.md). Staged into ./engagement by scripts/pentest-task.sh
      # or placed there manually before an interactive run.
      - ../engagement:/home/node/workspace/engagement:ro
      - ../config/openclaw.json5:/home/node/.openclaw/openclaw.json5:ro
    user: "${AGENT_UID:-1000}:${AGENT_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Rootless Docker-in-Docker used ONLY as the control plane for OpenClaw's
  # own per-session sandbox containers (agents.defaults.sandbox: docker
  # backend). This is deliberately NOT the host's /var/run/docker.sock — see
  # docs/architecture.md §6 for the trade-off analysis.
  sandbox-dind:
    image: docker:27-dind-rootless
    container_name: clawshell-sandbox-dind
    restart: unless-stopped
    privileged: false
    networks:
      - clawshell-sandbox
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - ../state/sandbox-dind:/home/rootless/.local/share/docker
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined  # required by rootless dind's own nested runtime; the
                              # outer container still has no host socket and no
                              # route to the internet or your LAN (clawshell-sandbox
                              # is `internal: true`)
    mem_limit: 4g
    cpus: "2.0"
    pids_limit: 1024

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.9.4}
    container_name: clawshell-openclaw-cli
    profiles: ["cli"]  # only started on demand via `docker compose run --rm openclaw-cli ...`
    network_mode: "service:openclaw-gateway"
    entrypoint: ["openclaw"]
    environment:
      HTTP_PROXY: "http://quota-guard:8080"
      HTTPS_PROXY: "http://quota-guard:8080"
      NO_PROXY: "local-llm,local-llm-amd,sandbox-dind,localhost,127.0.0.1"
    volumes:
      - ../state/openclaw:/home/node/.openclaw
      - ../workspaces:/home/node/workspace
      - ../engagement:/home/node/workspace/engagement:ro
    user: "${AGENT_UID:-1000}:${AGENT_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # --- Local GPU inference server (on-box NVIDIA GPU, e.g. RTX 6000 Ada) ---
  # The DEFAULT model backend for ClawShell (MODEL_PROVIDER=local-gpu). Serves
  # an OpenAI-compatible API from a model running entirely on the on-box GPU,
  # so engagement data (the target code, the requirement spec, findings) never
  # leaves the box to a third-party provider. Attached ONLY to the internal
  # clawshell-inference network — no internet route, not proxied through
  # quota-guard (there is no external spend to circuit-break on local tokens).
  #
  # Gated behind the `local-gpu` Compose profile and started by install.sh
  # only when MODEL_PROVIDER=local-gpu, so a host with no NVIDIA GPU (e.g. a
  # dev laptop validating config, or a hosted-provider deployment) is never
  # forced to pull/run it. Requires the NVIDIA Container Toolkit on the host
  # (install.sh installs it when MODEL_PROVIDER=local-gpu) — see
  # docs/credentials.md and docs/gpu.md.
  local-llm:
    image: ${LOCAL_LLM_IMAGE:-vllm/vllm-openai:v0.30.0}
    container_name: clawshell-local-llm
    profiles: ["local-gpu"]
    restart: unless-stopped
    networks:
      - clawshell-inference
    # No `ports:` — reachable only from openclaw-gateway over the internal
    # clawshell-inference network, never published to the host/LAN.
    environment:
      HUGGING_FACE_HUB_TOKEN: "${HUGGING_FACE_HUB_TOKEN:-}"
      # Keep the model server fully offline once the weights are present on
      # disk: no telemetry, no implicit downloads at request time.
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      DO_NOT_TRACK: "1"
    # Model id/path + serving flags come from .env so you can swap models
    # without editing compose. Defaults to a strong coding/analysis model;
    # pick one that fits your card's VRAM (see docs/gpu.md).
    command: >
      --model ${LOCAL_LLM_MODEL:-Qwen/Qwen2.5-Coder-32B-Instruct}
      --served-model-name ${LOCAL_LLM_SERVED_NAME:-clawshell-local}
      --host 0.0.0.0
      --port 8000
      --max-model-len ${LOCAL_LLM_MAX_MODEL_LEN:-32768}
      --gpu-memory-utilization ${LOCAL_LLM_GPU_MEM_UTIL:-0.92}
    volumes:
      # Persistent weight cache so a restart doesn't re-download the model.
      - ../state/local-llm:/root/.cache/huggingface
    # NVIDIA GPU reservation (any CUDA-capable card, e.g. RTX 6000 Ada).
    # Requires the NVIDIA Container Toolkit + `nvidia` runtime on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    shm_size: "16g"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "10m"
  # --- Local GPU inference server, AMD / ROCm variant --------------------
  # Alternative backend for MODEL_PROVIDER=local-gpu when LOCAL_LLM_BACKEND=
  # amd-rocm (e.g. a Radeon RX 7900 XTX). Runs Ollama's ROCm build, which
  # serves models on the AMD GPU via ROCm/HIP — no CUDA, no NVIDIA toolkit.
  #
  # IMPORTANT: OpenClaw talks to Ollama's NATIVE API, not the OpenAI-compatible
  # /v1 path (the /v1 path breaks tool calling — see docs/gpu.md and the
  # `ollama` provider entry in config/openclaw.json5.example). The Gateway
  # reaches it at http://local-llm-amd:11434 (NO /v1) over the internal
  # clawshell-inference network. Like the NVIDIA service it has no published
  # ports and no internet route, so engagement data stays on-box.
  #
  # Gated behind the `local-gpu-amd` Compose profile and started by install.sh
  # / sync_local_llm() ONLY when MODEL_PROVIDER=local-gpu AND
  # LOCAL_LLM_BACKEND=amd-rocm, so an NVIDIA or GPU-less host never pulls it.
  local-llm-amd:
    image: ${LOCAL_LLM_AMD_IMAGE:-ollama/ollama:rocm}
    container_name: clawshell-local-llm-amd
    profiles: ["local-gpu-amd"]
    restart: unless-stopped
    networks:
      - clawshell-inference
    # No `ports:` — reachable only from openclaw-gateway over the internal
    # clawshell-inference network, never published to the host/LAN.
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      # Keep the model server from phoning home for telemetry.
      OLLAMA_NOPRUNE: "1"
      # Ollama model TAG to serve (NOT a Hugging Face id). Must be an Ollama
      # tag such as "qwen2.5-coder:14b". Pulled on first start below.
      LOCAL_LLM_MODEL: "${LOCAL_LLM_MODEL:-qwen2.5-coder:14b}"
      # Some AMD cards need an LLVM target override; the RX 7900 XTX (gfx1100)
      # is natively supported, so this is blank by default. If Ollama reports
      # "no compatible GPUs", set e.g. HSA_OVERRIDE_GFX_VERSION=11.0.0 in .env.
      HSA_OVERRIDE_GFX_VERSION: "${HSA_OVERRIDE_GFX_VERSION:-}"
    # AMD GPU passthrough: the kernel-fusion-driver + render nodes. This is the
    # ROCm equivalent of the NVIDIA device reservation on the service above.
    devices:
      - /dev/kfd
      - /dev/dri
    # The container process must belong to the host's `video` and `render`
    # groups to open /dev/dri/renderD*. Group NAMES work on most Linux hosts;
    # if you hit permission errors, replace with the numeric GIDs from
    # `getent group render` / `getent group video` on the host.
    group_add:
      - video
      - render
    # Start the daemon, wait for it, pull the configured model once, then keep
    # serving. `$$` escapes Compose interpolation so the shell expands the var
    # at runtime. NOTE: clawshell-inference is internal (no egress), so this
    # pull only succeeds if the model is already staged in state/local-llm-amd
    # (see docs/gpu.md "Pre-staging the model"); it's a no-op once cached.
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done;
        ollama pull "$${LOCAL_LLM_MODEL}" || true;
        wait
    volumes:
      # Persistent model store so a restart doesn't re-pull the model.
      - ../state/local-llm-amd:/root/.ollama
    shm_size: "16g"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "10m"
  # DISABLED by default, gated behind the `caveman-proxy` Compose profile.
  # Verified against `docs/technical/cli-reference.md` and
  # `docs/technical/proxy-and-providers.md` upstream: `caveman start` is a
  # real, documented standalone daemon (not agent-launch wrapping), listens
  # loopback-only on 127.0.0.1:8787, and exposes an OpenAI-compatible
  # `/compat/upstream/...` mount once configured. See
  # docs/caveman-integration.md for the manual .env steps required to turn
  # this on (it only supports MODEL_PROVIDER=custom today).
  #
  # network_mode shares openclaw-gateway's network namespace — required
  # because the proxy refuses to bind any non-loopback address, so this is
  # the only way for the Gateway to reach it without giving caveman-proxy a
  # second, independent route to the internet. Its own outbound calls to the
  # real upstream provider still flow through quota-guard (HTTP_PROXY below),
  # which remains the sole enforcement point for the allowlist/circuit
  # breaker.
  caveman-proxy:
    build: ../caveman-proxy
    image: clawshell/caveman-proxy:local
    container_name: clawshell-caveman-proxy
    profiles: ["caveman-proxy"]
    depends_on:
      openclaw-gateway:
        condition: service_started
    network_mode: "service:openclaw-gateway"
    environment:
      DO_NOT_TRACK: "1"
      CAVEMAN_TELEMETRY: "0"
      HTTP_PROXY: "http://quota-guard:8080"
      HTTPS_PROXY: "http://quota-guard:8080"
      NO_PROXY: "local-llm,local-llm-amd,sandbox-dind,localhost,127.0.0.1"
      # The REAL upstream OpenAI-compatible endpoint — set this to what
      # MODEL_PROVIDER_BASE_URL used to point at before you enabled the
      # proxy. See docs/caveman-integration.md.
      CAVEMAN_UPSTREAM_BASE_URL: "${CAVEMAN_UPSTREAM_BASE_URL:-}"
      CAVEMAN_UPSTREAM_API_KEY_FILE: /run/secrets/model_provider_api_key
    secrets:
      - model_provider_api_key
    volumes:
      - ../state/caveman:/home/node/.caveman
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8787"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"

  # --- Black-box live-testing: scoped target egress gateway ----------------
  # ARMED ONLY for black-box live engagements (profile: blackbox-live). This is
  # the second, completely separate egress lane. It shares NOTHING with
  # quota-guard (which is the SaaS-cost guardrail for the AI-provider lane) --
  # it only reuses the same mitmproxy *pattern*. It is the single container that
  # can reach a black-box TARGET, and it enforces deny-by-default,
  # in-scope-only, rate-limited, approval-gated egress on clawshell-target-uplink.
  #
  # Because egress is deny-by-default against the per-engagement scope file, any
  # tool trying to phone home / report to an external service is structurally
  # dropped (that host is not in scope). Nothing is published to the host.
  target-gateway:
    build: ../target-gateway
    image: ${TARGET_GATEWAY_IMAGE:-clawshell/target-gateway:local}
    container_name: clawshell-target-gateway
    profiles: ["blackbox-live"]
    restart: unless-stopped
    networks:
      - clawshell-target
      - clawshell-target-uplink
    # No `ports:`. The control API (8089) is loopback-only inside the container
    # and is driven by pentest-task.sh / scripts/scope.sh via `docker exec`.
    volumes:
      - ../state/target-gateway:/state
      - ../logs/target-gateway:/logs
      # Per-engagement scope is staged here by the launcher (operator-provided,
      # the agent cannot widen it). Read-only to the gateway.
      - ../engagement/scope:/scope:ro
    environment:
      BLACKBOX_LIVE_TESTING: "${BLACKBOX_LIVE_TESTING:-false}"
      TARGET_RATE_DEFAULT: "${TARGET_RATE_DEFAULT:-5}"
      TARGET_MAX_CONCURRENCY: "${TARGET_MAX_CONCURRENCY:-2}"
      TARGET_RATE_SAFETY_FACTOR: "${TARGET_RATE_SAFETY_FACTOR:-0.8}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8089/status',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"

  # --- Black-box live-testing: curated pentest-tools MCP server ------------
  # ARMED ONLY for black-box live engagements (profile: blackbox-live). Exposes
  # a small set of SAFE-BY-DESIGN tools (Tier 0 passive HTTP primitives +
  # fingerprinting) to the Gateway over clawshell-mcp. Every tool request is
  # routed through target-gateway (clawshell-target) -- the MCP server has NO
  # other network path out, so it cannot reach a target except through the
  # scoped, rate-limited, approval-gated boundary.
  pentest-tools-mcp:
    build: ../pentest-tools-mcp
    image: ${PENTEST_TOOLS_MCP_IMAGE:-clawshell/pentest-tools-mcp:local}
    container_name: clawshell-pentest-tools-mcp
    profiles: ["blackbox-live"]
    restart: unless-stopped
    depends_on:
      target-gateway:
        condition: service_healthy
    networks:
      - clawshell-mcp
      - clawshell-target
    environment:
      BLACKBOX_LIVE_TESTING: "${BLACKBOX_LIVE_TESTING:-false}"
      TARGET_GATEWAY_PROXY: "http://target-gateway:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket;s=socket.create_connection(('127.0.0.1',8765),3);s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
